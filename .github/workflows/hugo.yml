name: Deploy Hugo site to Pages

on:
  push:
    branches: ["source"] # Triggered when you push to your source branch

permissions:
  contents: write    # Needed if the deploy action creates commits/tags
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. Install Hugo. Keep this version the same as HUGO_VERSION in the Makefile.
      - name: Install Hugo
        env:
          HUGO_VERSION: "0.170.1"
        run: |
          curl -sSLf -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$HOME/.local/bin"
          tar -xzf hugo.tar.gz -C "$HOME/.local/bin" hugo
          rm hugo.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 2. Build the site into the public folder
      - name: Build with Hugo
        run: hugo version && hugo -DEF

      # 3. Test the generated site. The deploy step does not run if a test fails.
      - name: Test the site
        run: python3 -m unittest discover -s tests -v

      # 4. Deploy the generated public folder to the master branch
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: master