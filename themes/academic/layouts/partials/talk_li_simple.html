<li {{ partial "talk_schema_scope" . }}>
  {{ partial "talk_schema_meta" (dict "page" . "people" true) }}
  <i class="fa-li fa fa-comment-o pub-icon" aria-hidden="true"></i>
  <a href="{{ .Permalink }}"><span itemprop="name">{{ .Title }}</span></a>
  <p>
    {{ .Date.Format $.Site.Params.date_format }},
    {{ if .Params.event_short }}
        {{ .Params.event_short | markdownify }}
    {{ else if .Params.event }}
            {{ .Params.event | markdownify }}
    {{ end }}
  </p>
</li>
